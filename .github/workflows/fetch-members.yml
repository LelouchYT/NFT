name: Update Guild Member Chronicle

on:
  workflow_dispatch:      # Handled exclusively by the Master Orchestrator or manual overrides

# Force the runner to execute all JavaScript actions using Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Architecture
      uses: actions/checkout@v4

    - name: Query Royal Archives for Roster Data (With Retries)
      run: |
        API_URL="https://gameinfo.albiononline.com/api/gameinfo/guilds/AIbIw4erSVyHg9Ab6LVtdA/members"
        MAX_RETRIES=5
        DELAY=15

        for (( i=1; i<=MAX_RETRIES; i++ )); do
          echo "Attempt $i/$MAX_RETRIES: Querying roster demographics from Albion API..."

          # Fetch payload and capture HTTP Status Code
          HTTP_STATUS=$(curl -s -w "%{http_code}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:124.0) Gecko/20100101 Firefox/124.0" \
                --max-time 45 \
                "$API_URL" -o new-members-data.json)

          # Validate HTTP 200 AND valid JSON formatting via jq
          if [ "$HTTP_STATUS" -eq 200 ] && jq . new-members-data.json > /dev/null 2>&1; then
            echo "Roster data payload saved and validated successfully on attempt $i."
            break
          fi

          echo "⚠️ Attempt $i failed (HTTP Status: $HTTP_STATUS or Invalid JSON)."
          if [ $i -lt $MAX_RETRIES ]; then
            echo "Waiting ${DELAY}s before retrying..."
            sleep $DELAY
            DELAY=$((DELAY + 10))
          else
            echo "❌ Critical Error: Roster data unreadable after $MAX_RETRIES sequential attempts."
            exit 1
          fi
        done

    - name: Compare Roster and Trigger Discord Webhook
      env:
        WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        cat << 'EOF' > compare.py
        import json, os, urllib.request, urllib.error, time

        old_file = 'members-data.json'
        new_file = 'new-members-data.json'
        webhook_url = os.environ.get('WEBHOOK_URL')

        def send_discord_webhook(payload, url):
            if not url or url.startswith("https://discord.com/api/webhooks/YOUR"):
                print("No valid WEBHOOK_URL configured. Skipping webhook execution.")
                return

            while True:
                req = urllib.request.Request(
                    url,
                    data=json.dumps(payload).encode('utf-8'),
                    headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
                )
                try:
                    urllib.request.urlopen(req)
                    time.sleep(2)  # Proactive rate-limit padding
                    break
                except urllib.error.HTTPError as e:
                    if e.code == 429:  # Discord Rate Limit
                        try:
                            retry_after = float(e.headers.get('Retry-After', 5))
                        except (ValueError, TypeError):
                            retry_after = 5
                        print(f"⚠️ Discord Rate Limit hit (HTTP 429). Retrying in {retry_after}s...")
                        time.sleep(retry_after)
                    else:
                        print(f"❌ HTTP Error {e.code} sending webhook.")
                        break
                except Exception as e:
                    print(f"❌ Webhook request failed: {e}")
                    break

        # Load old baseline
        old_data = []
        if os.path.exists(old_file):
            with open(old_file, 'r') as f:
                try:
                    old_data = json.load(f)
                except json.JSONDecodeError:
                    old_data = []

        # Load new payload
        with open(new_file, 'r') as f:
            try:
                new_data = json.load(f)
            except json.JSONDecodeError:
                print("Error: new-members-data.json contains invalid JSON.")
                exit(1)

        # Index player objects by ID
        old_members = {p['Id']: p for p in old_data if isinstance(p, dict) and 'Id' in p} if isinstance(old_data, list) else {}
        new_members = {p['Id']: p for p in new_data if isinstance(p, dict) and 'Id' in p} if isinstance(new_data, list) else {}

        # 1. Detect departures (in old baseline, but missing in new fetch)
        for old_id, old_player in old_members.items():
            if old_id not in new_members:
                name = old_player.get('Name', 'Unknown Player')
                kill_fame = old_player.get('KillFame', 0)
                death_fame = old_player.get('DeathFame', 0)

                lifetime_stats = old_player.get('LifetimeStatistics') or {}
                pve_stats = lifetime_stats.get('PvE') or {}
                pve_total = pve_stats.get('Total', 0)

                print(f"Detected departure: {name}")

                payload = {
                    "embeds": [{
                        "title": "🚪 Member Left Guild",
                        "description": f"**{name}** has left the guild in-game.",
                        "color": 15158332, # Red
                        "fields": [
                            {"name": "⚔️ Kill Fame", "value": f"{kill_fame:,}", "inline": True},
                            {"name": "💀 Death Fame", "value": f"{death_fame:,}", "inline": True},
                            {"name": "🛡️ PvE Total Fame", "value": f"{pve_total:,}", "inline": True},
                            {"name": "🔗 Killboard", "value": f"[View Profile](https://albiondb.net/player/{old_id})", "inline": False}
                        ]
                    }]
                }
                send_discord_webhook(payload, webhook_url)

        # 2. Detect new arrivals (in new fetch, but missing in old baseline) - skipped if baseline was empty
        if old_members:
            for new_id, new_player in new_members.items():
                if new_id not in old_members:
                    name = new_player.get('Name', 'New Recruit')
                    kill_fame = new_player.get('KillFame', 0)
                    death_fame = new_player.get('DeathFame', 0)

                    lifetime_stats = new_player.get('LifetimeStatistics') or {}
                    pve_stats = lifetime_stats.get('PvE') or {}
                    pve_total = pve_stats.get('Total', 0)

                    print(f"Detected new arrival: {name}")

                    payload = {
                        "embeds": [{
                            "title": "🎉 New Guild Recruit",
                            "description": f"**{name}** has joined the guild!",
                            "color": 3066993, # Green
                            "fields": [
                                {"name": "⚔️ Kill Fame", "value": f"{kill_fame:,}", "inline": True},
                                {"name": "💀 Death Fame", "value": f"{death_fame:,}", "inline": True},
                                {"name": "🛡️ PvE Total Fame", "value": f"{pve_total:,}", "inline": True},
                                {"name": "🔗 Killboard", "value": f"[View Profile](https://albiondb.net/player/{new_id})", "inline": False}
                            ]
                        }]
                    }
                    send_discord_webhook(payload, webhook_url)
        EOF
        python compare.py

    - name: Secure and Sync Archives to Repository
      run: |
        mv new-members-data.json members-data.json

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add members-data.json
        git diff-index --quiet HEAD || git commit -m "chore: dynamically sync outbound alliance roster telemetry [automated]"
        git push origin main
